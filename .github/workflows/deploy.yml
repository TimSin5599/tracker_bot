name: Deploy to Server

on:
  push:
    branches:
      - master  # Измените на вашу основную ветку (main, master, develop и т.д.)
  workflow_dispatch:  # Позволяет запускать вручную из GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t tracker-bot:${{ github.sha }} .
          docker tag tracker-bot:${{ github.sha }} tracker-bot:latest

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "."
          target: "/opt/tracker_bot"
          strip_components: 1
          exclude: |
            .git
            .github
            .venv
            data
            logs
            __pycache__
            *.pyc
            .env

      - name: Execute deployment script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /opt/tracker_bot
            docker-compose down
            docker-compose build --no-cache
            docker-compose up -d
            docker-compose logs --tail=50

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            sleep 10
            cd /opt/tracker_bot
            docker-compose ps
            docker-compose logs --tail=20 telegram-bot

